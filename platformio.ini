; WT32-ETH01 (ESP32 + LAN8720) – WiFiManager + strona konfiguracyjna Ethernet

[env:wt32-eth01]
platform = espressif32@6.9.0
board = wt32-eth01
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = min_spiffs.csv
lib_deps =
    tzapu/WiFiManager@^2.0.17
    adafruit/Adafruit NeoPixel@^1.12.3
build_flags =
    -DCORE_DEBUG_LEVEL=1
